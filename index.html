<style id="app-css">
/* Layout: coach console = roster rail + working sheet; student = single column. Paper report pages are fixed A4. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#eaeee6; --line:#d6ddd0; --fg:#141812; --muted:#5d6858;
  --accent:#2f7d2a; --accent-strong:#245f20; --accent-soft:#e1efdb; --on-accent:#ffffff; --ink:#0d0f0c;
  --ok:#2f7d2a; --warn:#b26b00; --bad:#b3261e; --ok-soft:#e1efdb; --warn-soft:#fbefd9; --bad-soft:#f8e1df;
  --ctrl:#3d8b37; --ord:#d9822b; --chq:#c0392b;
  --rp-paper:#ffffff; --rp-ink:#121510; --rp-muted:#66705f; --rp-line:#dfe5da; --rp-soft:#f1f5ee; --rp-accent:#2f7d2a; --rp-dark:#0d0f0c;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f120e; --surface:#171b15; --surface-2:#20261d; --line:#2e362a; --fg:#eef2ea; --muted:#9aa693;
  --accent:#62c25a; --accent-strong:#7fd477; --accent-soft:#1f3a1c; --on-accent:#0c120b; --ink:#000000;
  --ok:#7fd477; --warn:#f0b04a; --bad:#ff8a80; --ok-soft:#1f3a1c; --warn-soft:#3a2c12; --bad-soft:#3d1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f120e; --surface:#171b15; --surface-2:#20261d; --line:#2e362a; --fg:#eef2ea; --muted:#9aa693;
  --accent:#62c25a; --accent-strong:#7fd477; --accent-soft:#1f3a1c; --on-accent:#0c120b; --ink:#000000;
  --ok:#7fd477; --warn:#f0b04a; --bad:#ff8a80; --ok-soft:#1f3a1c; --warn-soft:#3a2c12; --bad-soft:#3d1a17; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:#62c25a}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.08em;color:#9aa693}
.top .sp{flex:1}
.tbtn{background:transparent;border:1px solid #39402f;color:#e8ede4;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.tbtn:hover{border-color:#62c25a}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.main{min-width:0;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.rail .list{max-height:240px}}
.search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.list{display:flex;flex-direction:column;gap:2px;overflow:auto}
.stu{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;text-align:left;background:none;width:100%}
.stu:hover{background:var(--surface-2)}
.stu.on{background:var(--accent-soft);border-color:var(--accent)}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--accent);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.stu .nm{font-weight:600;line-height:1.2}
.stu .meta{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-strong)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.stu:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.head h1{font-size:34px;text-transform:uppercase}
.head .sub{color:var(--muted);font-size:14px}
.head .sp{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.sec h2{font-size:19px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h2 .tag{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:none}
.grid{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.w2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.fld textarea{min-height:70px;resize:vertical}
.fld .unit{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.kpi{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.up{color:var(--bad)}.down{color:var(--ok)}
.evals{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td input,table.t td select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%;min-width:60px}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.flex-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.fx{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fx .t1{font-size:13px;font-weight:600}
.fx .t1 span{font-family:var(--f-display);color:var(--accent);margin-right:4px}
.seg{display:flex;gap:3px}
.seg button{flex:1;padding:5px 0;border:1px solid var(--line);background:var(--bg);border-radius:6px;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.post-grid{display:grid;gap:6px 14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.pi span{font-size:14px}
.pi select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.pi.has span{font-weight:700;color:var(--warn)}
.photos{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ph{border:1px dashed var(--line);border-radius:8px;aspect-ratio:3/4;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;background:var(--surface-2);cursor:pointer;text-align:center;font-size:13px;color:var(--muted)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .lab{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:4px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ph input{display:none}
.phase{display:flex;gap:6px;flex-wrap:wrap}
.phase button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700;text-align:left}
.phase button small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.phase button.c.on{border-color:var(--ctrl);background:color-mix(in srgb,var(--ctrl) 16%,var(--surface))}
.phase button.o.on{border-color:var(--ord);background:color-mix(in srgb,var(--ord) 16%,var(--surface))}
.phase button.x.on{border-color:var(--chq);background:color-mix(in srgb,var(--chq) 16%,var(--surface))}
.pct{display:flex;gap:4px;flex-wrap:wrap}
.pct button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.pct button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ficha{border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;background:var(--surface);overflow:hidden}
.ficha-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--surface-2)}
.ficha-h input{font-family:var(--f-display);font-size:20px;font-weight:700;border:1px solid transparent;background:transparent;padding:2px 6px;border-radius:6px;min-width:0;flex:1 1 160px}
.ficha-h input:hover,.ficha-h input:focus{border-color:var(--line);background:var(--bg)}
.load{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);font-size:26px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:18px;max-width:520px;width:100%;max-height:85vh;overflow:auto;border:1px solid var(--line)}
.modal h2{font-size:24px;margin-bottom:10px;text-transform:uppercase}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-soft)}
.ex-badge{display:inline-block;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase}
.calc{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
/* Student */
.login{max-width:420px;margin:8vh auto 0;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.login .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:40px;text-transform:uppercase}
.st-main{max-width:860px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ex{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.ex .ix{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--muted);width:24px}
.ex .en{font-weight:700}
.ex .es{font-size:13px;color:var(--muted)}
.ex a{color:var(--accent);font-weight:600;font-size:13px}
.thumb{width:96px;aspect-ratio:16/9;border-radius:6px;object-fit:cover;max-width:100%}
/* Report paper (fixed light, it is printed) */
#print-root{position:fixed;left:-12000px;top:0;width:794px;z-index:-1}
.rp{width:794px;height:1123px;background:var(--rp-paper);color:var(--rp-ink);font-family:var(--f-body);font-size:11px;line-height:1.35;padding:34px 40px 30px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.rp *{color:inherit}
.rp-h{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--rp-dark);padding-bottom:10px}
.rp-h .who small{display:block;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rp-muted)}
.rp-h .who b{font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.rp-h .what{text-align:right}
.rp-h .what small{display:block;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--rp-accent);text-transform:uppercase}
.rp-mark{display:flex;align-items:center;gap:8px}
.rp-mark i{width:30px;height:30px;background:var(--rp-dark);display:grid;place-items:center;font-style:normal;color:#62c25a;font-family:var(--f-display);font-weight:700;font-size:18px;border-radius:4px}
.rp h3{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-left:4px solid var(--rp-accent);padding-left:8px;margin:2px 0 0}
.rp-f{position:absolute;left:40px;right:40px;bottom:16px;display:flex;justify-content:space-between;font-size:9px;color:var(--rp-muted);border-top:1px solid var(--rp-line);padding-top:6px}
.rp-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rp-tile{border:1px solid var(--rp-line);border-radius:6px;padding:8px 10px}
.rp-tile small{display:block;font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rp-muted)}
.rp-tile b{display:block;font-family:var(--f-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.rp-tile em{font-style:normal;font-size:9.5px;font-weight:700}
.rp-g{color:#2f7d2a}.rp-r{color:#b3261e}.rp-n{color:#66705f}
.rp-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rp-t th{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--rp-muted);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--rp-dark)}
.rp-t td{padding:4px 6px;border-bottom:1px solid var(--rp-line)}
.rp-t td.n,.rp-t th.n{text-align:right}
.rp-t tr.grp td{background:var(--rp-soft);font-weight:700;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.rp-badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:9px;font-weight:700;background:var(--rp-soft)}
.rp-badge.ok{background:#e1efdb;color:#2f7d2a}.rp-badge.warn{background:#fbefd9;color:#9a5c00}.rp-badge.bad{background:#f8e1df;color:#b3261e}
.rp-box{border:1px solid var(--rp-line);border-radius:6px;padding:10px}
.rp-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rp-cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rp-big{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.rp-lbl{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rp-muted)}
.rp-sum{background:#fbefd9;border-left:4px solid #d9822b;padding:8px 10px;font-size:11.5px}
.rp-ph{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rp-ph div{aspect-ratio:3/4;background:var(--rp-soft);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--rp-muted);position:relative}
.rp-ph img{width:100%;height:100%;object-fit:cover}
.rp-chips{display:flex;flex-wrap:wrap;gap:4px}
.rp-chips span{border:1px solid var(--rp-line);border-radius:99px;padding:2px 8px;font-size:9.5px;color:var(--rp-muted)}
.rp-chips span.on{background:#fbefd9;border-color:#d9822b;color:#7a4a00;font-weight:700}
.rp-cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rp-cmp div{aspect-ratio:3/4;background:var(--rp-soft);border-radius:4px;overflow:hidden;position:relative}
.rp-cmp img{width:100%;height:100%;object-fit:cover}
.rp-cmp span{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-weight:700;padding:3px 8px;font-size:10px}
@media (max-width:520px){.ex{grid-template-columns:auto auto minmax(0,1fr)}.ex .thumb{display:none}}
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard .fld{flex:1}
.ref{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:12.5px}
.ref-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.ref-n{font-size:11.5px;color:var(--muted);margin-top:4px}
.ref table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.ref th{font-size:10.5px;font-weight:700;color:var(--muted);text-align:left;padding:3px 5px;white-space:nowrap}
.ref td{padding:3px 5px;border-top:1px solid var(--line);white-space:nowrap}
.ref tr.cur td{background:var(--accent-soft);font-weight:700}
.ref td.hit{background:var(--accent);color:var(--on-accent)}
.fx-img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:6px;max-width:100%}
.fx-none{display:grid;place-items:center;color:var(--muted);font-size:12px;background:var(--surface-2)}
.pview{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;padding-block:12px;border-top:1px solid var(--line)}
.pview:first-of-type{border-top:0}
@media (max-width:640px){.pview{grid-template-columns:1fr}.pview .ph{max-width:260px}}
.pv-h{font-size:18px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.plist{display:grid;gap:0 16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pi em{font-style:normal;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
table.macro td,table.macro th{text-align:center;padding:4px}
table.macro td:first-child,table.macro th:first-child{text-align:left;font-weight:700;white-space:nowrap;position:sticky;left:0;background:var(--surface)}
table.t.macro td select{min-width:124px;width:124px;padding:4px;font-size:12px}
table.macro td.mblock{padding:3px 2px}
table.macro .mb{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;padding:5px 8px;min-height:34px}
table.macro .mrow-periodo .mb{background:var(--ink);color:#fff}
table.macro .mrow-fase .mb{background:var(--accent);color:var(--on-accent)}
table.macro .mrow-meso .mb{background:var(--accent-soft);color:var(--fg);border:1px solid var(--accent)}
table.t.macro td .mb select{background:transparent;border:0;color:inherit;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;min-width:0;width:auto;padding:2px}
table.macro .mb select option{color:#141812;background:#fff}
table.macro .mb-n{display:inline-flex;align-items:center;gap:3px;font-size:11px;opacity:.9;white-space:nowrap}
table.macro .mb-n button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:4px;width:20px;height:20px;padding:0;line-height:1;cursor:pointer;font-size:12px}
table.macro .mb-n button:disabled{opacity:.3;cursor:default}
table.macro th.now{color:var(--accent);background:var(--accent-soft)}
.grp-row{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;background:var(--surface-2)}
.figbox{width:84px;height:84px;background:var(--surface-2);border-radius:8px;display:block}
.anim3d{display:block;flex:none;background:#fff;border-radius:8px;overflow:hidden;position:relative}.anim3d iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
@media (max-width:520px){.ex .anim3d{width:112px!important;height:63px!important}}
.rp-ph1{aspect-ratio:3/4;background:var(--rp-soft);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--rp-muted)}
.rp-ph1 img{width:100%;height:100%;object-fit:cover}
.tmark{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.tmark.ok{background:var(--ok-soft);color:var(--ok)}
table.macro tr.kgrow td{vertical-align:bottom;padding-top:6px}
table.macro tr.kgrow td.now{background:var(--accent-soft)}
.kbar{height:66px;display:flex;align-items:flex-end;justify-content:center}
.kbar span{display:block;width:60%;border-radius:4px 4px 0 0}
.kval{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function figPose(key, ph){
  const F = FIGS[key], k = (1 - Math.cos(ph * Math.PI * 2)) / 2, P = {};

  const L = FIG_L, up = (p, a, l) => [p[0] + l * Math.sin(rad(a)), p[1] - l * Math.cos(rad(a))], dn = (p, a, l) => [p[0] + l * Math.sin(rad(a)), p[1] + l * Math.cos(rad(a))];
  let ank, knee, hip;
  if (F.mode === 'feet'){ ank = [92, 178 - (P.lift || 0)]; knee = up(ank, P.s, L.sh); hip = up(knee, P.t, L.th); }

async function buildPdfBlob(st, coach, opts){
  if (!window.jspdf || !window.html2canvas) throw new Error('lib');
  const root = $('#print-root'); root.innerHTML = reportPages(st, coach, opts).join('');
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  await new Promise(r => setTimeout(r, 150));
  const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
  const pages = root.querySelectorAll('.rp');
  for (let i = 0; i < pages.length; i++){
    const cv = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: 794 });
    if (i) pdf.addPage();
    pdf.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 595.28, 841.89);
  }
  root.innerHTML = '';
  return pdf.output('blob');
}
async function makePdf(st, opts){

}
function buildStudentPayload(st, secret){
    const data = JSON.parse(JSON.stringify({ coach: Object.assign({}, S.coach, {look: Object.assign({avatar: DEFAULT_AVATAR}, S.coach.look || {})}), student: st }));
    delete data.student.anamnese; // o aluno vê treinos e avaliação
    const t = ensureTreino(st);
    data.student.treino = { inicio: t.inicio, obs: t.obs || '',
      fichas: t.fichas.map(f => ({ id: f.id, nome: f.nome, foco: f.foco, ex: (f.ex || []).map(e => ({ id: e.id, nome: e.nome, series: e.series, reps: e.reps, conc: e.conc, exc: e.exc, desc: e.desc, video: e.video, fig: e.fig, anim: e.anim })) })),
      weeks: t.macro.map((m, i) => { const loads = {}; const fsw = fichasAt(t, i); fsw.forEach(f => (f.ex || []).forEach(e => { const l = loadAt(t, e, i); if (l != null) loads[e.id] = l; })); const bk = blockOf(t, i); return { b: bk.key, teste: bk.start === i, start: addDays(t.inicio, i * 7), loads, fs: fsw.map(f => f.id) }; }) }; // fase e % ficam só com o treinador
    const salt = hex(sha256(te.encode(uid() + Math.random())).slice(0, 8));
    const key = deriveKey(st.name, st.dob, salt, secret);
    const ct = xorStream(key, te.encode(JSON.stringify(data)));
    const payload = { v: 3, sec: !!secret, logo: S.coach.logo || DEFAULT_LOGO, avatar: (S.coach.look || {}).avatar || DEFAULT_AVATAR, salt, check: hex(sha256(cat(key, te.encode('ok')))).slice(0, 16), data: b64e(ct), studio: S.coach.studio || '', coach: S.coach.name || '' };
    return payload;
}

      <section class="sec"><h2>Composição corporal</h2><div class="kpis">
        ${k('Peso', fmt(c.peso, 1), 'kg', prev ? dd(c.peso, prev.peso, 1, 'none') : '')}

  }
  app.innerHTML = `<header class="top"><div class="top-in"><div class="brand">${esc(STUDENT.studio || 'Ápice Studio')}</div><span class="sp"></span><button class="tbtn" id="s-out">Sair</button></div></header>

  upd();
  app.oninput = e => { const tk = e.target.dataset.tkg, tr = e.target.dataset.trp, id = tk || tr; if (!id) return; sTest[id] = sTest[id] || {}; sTest[id][tk ? 'kg' : 'reps'] = e.target.value; sSaveTest(); const r = sTest[id], rm = brzycki(num(r.kg), num(r.reps)); const el = document.getElementById('rm-' + id); if (el) el.innerHTML = rm ? '1RM ≈ <b>' + fmt(rm, 1) + ' kg</b>' : ''; upd(); };

/* ================= NUVEM (GitHub) — só na versão instalada ================= */
const PWA = !!window.__APICE_PWA__;
const CLOUD_KEY = 'apice-nuvem';
const cloud = {
  cfg: (() => { try { return JSON.parse(localStorage.getItem(CLOUD_KEY) || 'null'); } catch (e) { return null; } })(),
  sha: null, state: 'off', last: null, lastErr: '', timer: null, dirty: false, busy: false,
  ok(){ return PWA && this.cfg && this.cfg.user && this.cfg.token && this.cfg.dataRepo && this.cfg.appRepo; },
  save(c){ this.cfg = c; try { localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); } catch (e) {} },
  async api(method, repo, path, body, raw){
    let r; try { r = await fetch(`https://api.github.com/repos/${encodeURIComponent(this.cfg.user)}/${encodeURIComponent(repo)}/contents/${path}` + (method === 'GET' ? '?t=' + Date.now() : ''), {
      method, cache: 'no-store', headers: Object.assign({ Authorization: 'Bearer ' + this.cfg.token, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body ? {'Content-Type': 'application/json'} : {}),
      body: body ? JSON.stringify(body) : undefined }); } catch (x) { throw new Error('Sem conexão com o GitHub (' + method + ' ' + path + '): ' + (x && x.message || x)); }
    if (r.status === 404) return null;
    if (!r.ok){ const t = await r.text().catch(() => ''); let m = t; try { m = JSON.parse(t).message || t; } catch (x) {} const e = new Error('GitHub ' + r.status + ' (' + method + ' ' + path + '): ' + String(m).slice(0, 200)); e.status = r.status; throw e; }
    return raw ? r.text() : r.json();
  },
  async meta(repo, path){ const m = await this.api('GET', repo, path); return m && m.sha ? m : null; },
  async put(repo, path, text, msg){ const m = await this.meta(repo, path); const b = { message: msg, content: b64e(te.encode(text)) }; if (m) b.sha = m.sha; const r = await this.api('PUT', repo, path, b); return r && r.content ? r.content.sha : null; },
  async pull(){ const m = await this.meta(this.cfg.dataRepo, 'dados/apice.json'); if (!m) return null; const txt = await this.api('GET', this.cfg.dataRepo, 'dados/apice.json', null, true); this.sha = m.sha; return JSON.parse(txt); },
  async push(){
    if (!this.ok() || this.busy) return; if (!navigator.onLine){ this.set('offline'); return; }
    this.busy = true; this.set('sync');
    try {
      const remoteMeta = await this.meta(this.cfg.dataRepo, 'dados/apice.json');
      if (remoteMeta && this.sha && remoteMeta.sha !== this.sha){ // alguém salvou em outro aparelho
        const remote = JSON.parse(await this.api('GET', this.cfg.dataRepo, 'dados/apice.json', null, true));
        if ((remote.updatedAt || 0) > (S.updatedAt || 0)){ S = remote; this.sha = remoteMeta.sha; await store.set(S); this.dirty = false; this.busy = false; this.set('ok'); render(); toast('Dados atualizados com o outro aparelho.'); return; }
      }
      this.sha = await this.put(this.cfg.dataRepo, 'dados/apice.json', JSON.stringify(S), 'Atualização ' + new Date().toLocaleString('pt-BR'));
      this.dirty = false; this.last = new Date(); this.set('ok');
    } catch (e) { this.lastErr = (e && e.message) || String(e); this.set(e.status === 401 || e.status === 403 ? 'auth' : navigator.onLine ? 'erro' : 'offline'); }
    this.busy = false; if (this.dirty) this.schedule();
  },
  schedule(){ if (!this.ok()) return; this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 2500); },
  async start(){
    if (!this.ok()) { this.set(PWA ? 'cfg' : 'off'); return; }
    if (!navigator.onLine){ this.set('offline'); return; }
    this.set('sync');
    try { const remote = await this.pull();
      const seedOnly = !S.updatedAt || S.students.every(x => x.example);
      if (remote && Array.isArray(remote.students) && (seedOnly || (remote.updatedAt || 0) > (S.updatedAt || 0))){ S = remote; await store.set(S); V.sid = (S.students[0] || {}).id || null; V.eid = null; render(); this.set('ok'); this.last = new Date(); }
      else if (!remote || (S.updatedAt || 0) > (remote.updatedAt || 0)) { this.dirty = true; await this.push(); }
      else { this.set('ok'); this.last = new Date(); }
    } catch (e) { this.lastErr = (e && e.message) || String(e); this.set(e.status === 401 || e.status === 403 ? 'auth' : 'erro'); }
  },
  set(s){ this.state = s; const el = document.getElementById('cloud-st'); if (el) el.innerHTML = cloudBadge(); },
  async publishStudent(st){
    if (!st.linkSecret) st.linkSecret = hex(sha256(te.encode(uid() + Math.random() + Date.now()))).slice(0, 20);
    const payload = buildStudentPayload(st, st.linkSecret);
    await this.put(this.cfg.appRepo, 'alunos/' + st.id + '.json', JSON.stringify(payload), 'Treino de ' + firstName(st.name));
    st.linkPub = new Date().toISOString(); persist();
    return studentLink(st);
  }
};
const studentLink = st => `https://${cloud.cfg.user.toLowerCase()}.github.io/${cloud.cfg.appRepo}/#aluno/${st.id}/${st.linkSecret}`;
function cloudBadge(){
  const m = { off: '', cfg: '☁ Configurar nuvem', sync: '☁ Sincronizando…', ok: '☁ Na nuvem' + (cloud.last ? ' · ' + cloud.last.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}) : ''), offline: '☁ Offline · salvo no aparelho', erro: '☁ Erro ao sincronizar', auth: '☁ Token inválido' }[cloud.state] || '';
  return m ? `<button class="tbtn" data-act="cloud" style="${cloud.state === 'erro' || cloud.state === 'auth' ? 'border-color:#ff8a80;color:#ff8a80' : cloud.state === 'ok' ? 'border-color:#62c25a' : ''}">${m}</button>` : '';
}
window.addEventListener('online', () => { if (cloud.dirty || cloud.state === 'offline') cloud.push(); });
window.addEventListener('offline', () => cloud.set('offline'));
function cloudModal(){
  const c = cloud.cfg || {};
  return `<div class="modal-bg" data-act="close-modal"><div class="modal" data-stop>
    <h2>Nuvem (GitHub)</h2>

    <div class="grid w2" style="margin-top:10px">

      <div class="fld"><label for="gh_tok">Token de acesso</label><input id="gh_tok" type="password" value="${esc(c.token || '')}" autocomplete="off" placeholder="github_pat_…"></div>
    </div>
    ${cloud.lastErr && cloud.state !== 'ok' ? `<p class="note warn" style="margin-top:10px;word-break:break-word"><b>Último erro:</b> ${esc(cloud.lastErr)}</p>` : ''}
    <p class="small muted" style="margin-top:8px">O token fica só neste aparelho. Repita esta configuração uma vez em cada aparelho (Mac e iPhone).</p>
    <div class="row" style="margin-top:14px;justify-content:flex-end">${c.token ? '<button class="btn ghost danger" data-act="cloud-off">Desligar neste aparelho</button>' : ''}<button class="btn" data-act="close-modal">Fechar</button><button class="btn pri" data-act="cloud-save">Salvar e sincronizar</button></div></div></div>`;
}
async function cloudSaveFromModal(){
  const v = id => ($('#' + id) || {}).value || '';
  const c = { user: v('gh_user').trim(), appRepo: v('gh_app').trim(), dataRepo: v('gh_data').trim(), token: v('gh_tok').trim() };
  if (!c.user || !c.token || !c.appRepo || !c.dataRepo){ toast('Preencha os quatro campos.'); return; }

  try { const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.user)}/${encodeURIComponent(c.dataRepo)}`, {headers: {Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json'}}); if (!r.ok){ const e = new Error(); e.status = r.status; throw e; } } catch (e) { cloud.set(e.status === 401 || e.status === 403 ? 'auth' : 'erro'); toast(e.status === 404 ? 'Não encontrei o repositório dos dados. Confira o nome.' : 'O GitHub recusou o token. Confira as permissões.'); return; }
  await cloud.start(); toast('Nuvem ligada.');
}

/* ================= boot ================= */
function render(){ if (STUDENT) renderStudent(); else renderCoach(); }
async function boot(){
  const hm = (location.hash || '').match(/^#aluno\/([\w-]+)\/([\w-]+)/);
  if (hm){
    $('#app').innerHTML = '<div class="empty"><h2>Carregando seu treino…</h2></div>';
    const ck = 'apice-aluno-' + hm[1];
    try { const r = await fetch('alunos/' + hm[1] + '.json?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) throw 0; const txt = await r.text(); STUDENT = JSON.parse(txt); try { localStorage.setItem(ck, txt); } catch (e) {} }
    catch (e) { try { STUDENT = JSON.parse(localStorage.getItem(ck) || 'null'); } catch (e2) {} }
    if (!STUDENT){ $('#app').innerHTML = '<div class="empty"><h2>Não foi possível abrir</h2><p>Confira o link enviado pelo seu treinador e a sua internet.</p></div>'; return; }
    STUDENT.secret = hm[2]; render(); return;
  }
  if (STUDENT){ render(); return; }
  bindCoach();
  render();
  const d = await store.get();
  if (d && Array.isArray(d.students)){ S = d; S.coach = S.coach || {}; }
  else { S.students = [exampleStudent()]; S.updatedAt = 0; store.set(S); }
  if (!V.sid && S.students.length){ V.sid = S.students[0].id; V.tab = 'avaliacao'; }
  render();
  cloud.start();
}
boot();
})();
